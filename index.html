<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
<title>AZURE HAIR SALON｜Renewal Design Preview</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#eef6fb}
body{font-family:-apple-system,BlinkMacSystemFont,"Yu Gothic",sans-serif}
.preview{width:min(1491px,100%);margin:0 auto;background:#fff;min-height:100vh;box-shadow:0 10px 40px rgba(5,52,91,.12)}
.preview img{display:block;width:100%;height:auto}
.loading,.error{min-height:100vh;display:grid;place-items:center;padding:32px;color:#073f73;text-align:center;line-height:1.8}
.error{display:none}
@media(max-width:600px){.preview{box-shadow:none}.preview img{width:100%}}
</style>
<script src="design-part-0.js?v=20260730-1645"></script>
</head>
<body>
<main class="preview">
<div id="loading" class="loading">AZURE リニューアルデザインを読み込んでいます…</div>
<div id="error" class="error">デザイン画像を読み込めませんでした。ページを閉じて、もう一度開いてください。</div>
<img id="design" alt="AZURE HAIR SALON リニューアル完成デザイン" hidden>
</main>
<script>
(function(){
 const image=document.getElementById('design');
 const loading=document.getElementById('loading');
 const error=document.getElementById('error');
 const data=window.__AZURE_DESIGN||'';
 if(!data){loading.style.display='none';error.style.display='grid';return;}
 image.onload=function(){loading.style.display='none';image.hidden=false;};
 image.onerror=function(){loading.style.display='none';error.style.display='grid';};
 image.src='data:image/webp;base64,'+data;
})();
</script>
</body>
</html>
